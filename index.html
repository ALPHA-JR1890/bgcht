<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Dynamic Theme Background</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ambient Cosmic Particle Canvas Background -->
    <canvas id="galaxyCanvas"></canvas>

    <!-- Top Corner Navigation (Pins upload trigger to top right corner) -->
    <header class="top-nav">
        <div id="statusMessage" class="status-badge">Default Theme Active</div>
        <label for="imageUpload" class="upload-btn">Choose Theme Image</label>
        <input type="file" id="imageUpload" accept="image/*">
    </header>

    <script src="script.js"></script>
</body>
</html>
